<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DOOM DAW — IRKEN Audio Lab. AI-powered cyberpunk digital audio workstation. Generate beats with Gemini, sequence synths, and create music in the browser." />
    <meta property="og:title" content="DOOM DAW — IRKEN Audio Lab" />
    <meta property="og:description" content="AI-powered cyberpunk DAW. Generate beats, sequence synths, create music in the browser." />
    <meta property="og:type" content="website" />
    <title>DOOM-DAW // IRKEN LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --zim-green: #39ff14;
        --zim-purple: #b026ff;
        --zim-dark: #050508;
        --zim-pink: #ff0055;
        --grid-color: rgba(57, 255, 20, 0.1);
      }
      body {
        background-color: var(--zim-dark);
        color: var(--zim-green);
        font-family: 'Share Tech Mono', monospace;
        overflow-x: hidden;
      }
      
      /* --- SCROLLBAR --- */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--zim-purple); 
        border: 1px solid #000;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--zim-green); 
        box-shadow: 0 0 10px var(--zim-green);
      }

      /* --- CRT & SCANLINES --- */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.3) 50%,
          rgba(0,0,0,0.3)
        );
        background-size: 100% 4px;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 999;
      }
      .crt-flicker {
        animation: flicker 0.15s infinite;
        pointer-events: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(57, 255, 20, 0.02);
        z-index: 998;
      }
      @keyframes flicker {
        0% { opacity: 0.9; }
        50% { opacity: 1.0; }
        100% { opacity: 0.9; }
      }

      /* --- BACKGROUND GRID --- */
      .bg-grid {
        position: fixed;
        top: 0; left: 0; width: 200vw; height: 200vh;
        background-image: 
          linear-gradient(var(--grid-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
        transform-origin: top center;
        animation: grid-move 20s linear infinite;
        z-index: -1;
        pointer-events: none;
      }
      @keyframes grid-move {
        0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
        100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
      }

      /* --- GLITCH TEXT --- */
      .glitch {
        position: relative;
        color: var(--zim-green);
      }
      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--zim-dark);
      }
      .glitch::before {
        left: 2px;
        text-shadow: -1px 0 var(--zim-purple);
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim-1 5s infinite linear alternate-reverse;
      }
      .glitch::after {
        left: -2px;
        text-shadow: -1px 0 var(--zim-pink);
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim-2 5s infinite linear alternate-reverse;
      }

      @keyframes glitch-anim-1 {
        0% { clip: rect(20px, 9999px, 11px, 0); }
        20% { clip: rect(68px, 9999px, 9px, 0); }
        40% { clip: rect(5px, 9999px, 63px, 0); }
        60% { clip: rect(85px, 9999px, 19px, 0); }
        80% { clip: rect(32px, 9999px, 4px, 0); }
        100% { clip: rect(10px, 9999px, 83px, 0); }
      }
      @keyframes glitch-anim-2 {
        0% { clip: rect(65px, 9999px, 90px, 0); }
        20% { clip: rect(12px, 9999px, 3px, 0); }
        40% { clip: rect(55px, 9999px, 78px, 0); }
        60% { clip: rect(9px, 9999px, 20px, 0); }
        80% { clip: rect(41px, 9999px, 12px, 0); }
        100% { clip: rect(26px, 9999px, 94px, 0); }
      }

      /* --- CYBER PANEL --- */
      .cyber-panel {
        background: rgba(10, 10, 15, 0.85);
        border: 1px solid var(--zim-green);
        position: relative;
        box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
        backdrop-filter: blur(5px);
      }
      .cyber-panel::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px;
        border-top: 10px solid var(--zim-green);
        border-right: 10px solid transparent;
        width: 0; height: 0;
      }
      .cyber-panel::after {
        content: '';
        position: absolute;
        bottom: -1px; right: -1px;
        border-bottom: 10px solid var(--zim-green);
        border-left: 10px solid transparent;
        width: 0; height: 0;
      }
      
      /* --- NEON TEXT --- */
      .neon-text-green { text-shadow: 0 0 5px var(--zim-green), 0 0 15px var(--zim-green); }
      .neon-text-purple { text-shadow: 0 0 5px var(--zim-purple), 0 0 15px var(--zim-purple); }
      .neon-text-pink { text-shadow: 0 0 5px var(--zim-pink), 0 0 15px var(--zim-pink); }

      /* --- UTILS --- */
      .clip-slant-right {
        clip-path: polygon(0 0, 100% 0, 100% 70%, 90% 100%, 0 100%);
      }
      .clip-slant-left {
        clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%, 0 30%);
      }
    </style>
</head>
  <body>
    <script type="module" src="/index.tsx"></script>
    <div id="root"></div>
    <div class="scanlines"></div>
    <div class="crt-flicker"></div>
    <div class="bg-grid"></div>
  </body>
</html>
