# Deploy to Vercel production on every push to main/master.
# Required repository secrets (set in Settings → Secrets → Actions):
#   VERCEL_TOKEN       — from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — Vercel team/personal org ID (vercel env pull or Dashboard → Settings)
#   VERCEL_PROJECT_ID  — Vercel project ID (vercel env pull or Dashboard → Settings)
name: Deploy to Vercel

on:
  push:
    branches: [main, master]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build:raw

      - name: Deploy to Vercel (production)
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
